<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilipinas Travel</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="shotcut icon" href="">
  </head>

  <body>

    <header class="navbar"> 
      <div class="logo">
        <span>🌴</span> <!--Change this emoji to the actual system logo-->
        Pilipinas Travel
      </div>

      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">Destinations</a> <!--drop down menu-->
        <a href="#">Travel Packages</a> <!--something like cards-->
        <a href="#">Reservation</a> <!--almost same ui as home-->
        <a href="#">About</a> <!--contact info is included here-->
      </nav>


      <!-- Right side -->

      <div class="nav-right">
        <a href="#">Log In</a> <!--something like modal-->

        <button class="signup-button"> <!--redirect to sign up page?-->
          Sign Up
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <!-- Heading -->
        <h1>
          Discover the Beauty of the Philippines
        </h1>

        <!-- Description -->
        <p class="sub-description">
          Explore breathtaking destinations,
          unforgettable experiences, and
          hidden gems across the Philippines.
        </p>

        <!-- Search Form -->
        <div class="search-box">

          <!-- Destination -->
          <div class="search-field">
            <label>
              Where do you want to go?
            </label>
            <input type="text" placeholder="Palawan, Cebu, Boracay..."
            >
          </div>

          <!-- Travel date -->
          <div class="search-field">
            <label>
              Travel Date
            </label>
            <input type="text" placeholder="Preferred date"
            >
          </div>

          <!-- Activities -->
          <div class="search-field">
            <label>
              Activities
            </label>
            <input type="text" placeholder="Any activity"
            >
          </div>

          <!-- Head Count -->
          <div class="search-field">
            <label>
              Head Count
            </label>
            <input type="text" placeholder="2 Adults"
            >
          </div>

          <!-- Search button -->
          <button class="search-button">
            Search
          </button>
        </div>
      </section>

      <!-- Cards Below Hero -->
      <section class="content">
        <h2>Explore the Philippines</h2>
        <p style="margin-top: 10px; color: #666;">
          More travel experiences coming soon...
        </p>
      </section>
    </main>

  </body>
</html>
